[project]
name = "ai-coaching-agent-2"
version = "0.1.0"
description = "AgentOS service for AI Coaching Agent 2 that answers via Hindsight reflect."
requires-python = ">=3.11"
dependencies = [
  "agno>=2.6.4",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
  "uvicorn>=0.30.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
