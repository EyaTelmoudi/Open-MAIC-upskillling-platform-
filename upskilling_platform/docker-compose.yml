services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -ec '</dev/tcp/127.0.0.1/5672'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      PIPER_PORT: 5000
      PIPER_HOST: 0.0.0.0
      PIPER_DATA_DIR: /voices
    ports:
      - "5005:5000"
    volumes:
      - piper_voices:/voices
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 5000), 5); s.close()\""]
      interval: 20s
      timeout: 10s
      retries: 6

  hindsight:
    build:
      context: ../hindsight/hindsight
      dockerfile: docker/standalone/Dockerfile
      target: api-only
      args:
        INCLUDE_API: "true"
        INCLUDE_CP: "false"
        INCLUDE_LOCAL_MODELS: "${HINDSIGHT_INCLUDE_LOCAL_MODELS:-false}"
        PRELOAD_ML_MODELS: "${HINDSIGHT_PRELOAD_ML_MODELS:-false}"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-info}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openrouter}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-120b:free}
      HINDSIGHT_API_OPENROUTER_API_KEY: ${HINDSIGHT_API_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-openrouter}
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-openrouter}
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: ${HINDSIGHT_API_SKIP_LLM_VERIFICATION:-false}
      HINDSIGHT_API_LAZY_RERANKER: ${HINDSIGHT_API_LAZY_RERANKER:-true}
    ports:
      - "${HINDSIGHT_PORT:-8888}:8888"
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
      - "8080:8080"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - upskilling_network
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    expose:
      - "8001"
    env_file: .env
    volumes:
      - ./services/identity:/app/services/identity
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/superadmin`) || PathPrefix(`/setup`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.services.identity.loadbalancer.server.port=8001"
      - "traefik.http.routers.identity.middlewares=cors-headers,rate-limit"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  learning:
    build:
      context: .
      dockerfile: services/learning/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    expose:
      - "8002"
    env_file: .env
    volumes:
      - ./services/learning:/app/services/learning
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learning.rule=PathPrefix(`/api/v1/learning`)"
      - "traefik.http.routers.learning.entrypoints=web"
      - "traefik.http.services.learning.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.learning-stripprefix.stripprefix.prefixes=/api/v1/learning"
      - "traefik.http.routers.learning.middlewares=cors-headers,rate-limit,learning-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  agents:
    build:
      context: ./services/agents
    restart: unless-stopped
    expose:
      - "8003"
    env_file: .env
    volumes:
      - ./services/agents:/app
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agents.rule=PathPrefix(`/api/v1/agents`)"
      - "traefik.http.routers.agents.entrypoints=web"
      - "traefik.http.services.agents.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.agents-stripprefix.stripprefix.prefixes=/api/v1/agents"
      - "traefik.http.routers.agents.middlewares=cors-headers,rate-limit,agents-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    expose:
      - "8004"
    env_file: .env
    volumes:
      - ./services/notifications:/app/services/notifications
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/api/v1/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.services.notifications.loadbalancer.server.port=8004"
      - "traefik.http.middlewares.notifications-stripprefix.stripprefix.prefixes=/api/v1/notifications"
      - "traefik.http.routers.notifications.middlewares=cors-headers,rate-limit,notifications-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://${PUBLIC_HOST:-localhost}:${GATEWAY_PORT:-8000}
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:${GATEWAY_PORT:-8000}
        NEXT_PUBLIC_IDENTITY_URL: http://${PUBLIC_HOST:-localhost}:${IDENTITY_SERVICE_PORT:-8001}
        NEXT_PUBLIC_LEARNING_URL: http://${PUBLIC_HOST:-localhost}:${LEARNING_SERVICE_PORT:-8002}
        NEXT_PUBLIC_AGENTS_URL: http://${PUBLIC_HOST:-localhost}:${AGENTS_SERVICE_PORT:-8003}
        NEXT_PUBLIC_NOTIFICATIONS_URL: http://${PUBLIC_HOST:-localhost}:${NOTIFICATIONS_SERVICE_PORT:-8004}
        NEXT_PUBLIC_FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3000}
        NEXT_PUBLIC_SETUP_KEY: ${SETUP_SECRET_KEY}
        SKIP_NEXT_BUILD_CHECKS: "1"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file: .env
    environment:
      INTERNAL_API_URL: http://traefik
      INTERNAL_IDENTITY_URL: http://identity:8001
    networks:
      - upskilling_network
    depends_on:
      identity:
        condition: service_started
      learning:
        condition: service_started
      notifications:
        condition: service_started
      agents:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  piper_voices:
  hindsight_data:

networks:
  upskilling_network:
    driver: bridge
