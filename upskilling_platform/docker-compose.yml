services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      PIPER_PORT: 5000
      PIPER_HOST: 0.0.0.0
      PIPER_DATA_DIR: /voices
    ports:
      - "5005:5000"
    volumes:
      - piper_voices:/voices
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/voices"]
      interval: 20s
      timeout: 10s
      retries: 6

  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMFYUI_HOST: 0.0.0.0
      COMFYUI_PORT: 8188
      COMFYUI_MODEL_NAME: ${COMFYUI_MODEL_NAME:-sd-v1-5-tiny.safetensors}
      COMFYUI_MODEL_REPO: ${COMFYUI_MODEL_REPO:-ehristoforu/stable-diffusion-v1-5-tiny}
      COMFYUI_MODEL_FILE: ${COMFYUI_MODEL_FILE:-sd-v1-5-tiny.safetensors}
      COMFYUI_ARGS: ${COMFYUI_ARGS:---cpu}
    ports:
      - "8188:8188"
    volumes:
      - comfyui_models:/opt/ComfyUI/models
      - comfyui_input:/opt/ComfyUI/input
      - comfyui_output:/opt/ComfyUI/output
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 10

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
      - "8080:8080"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - upskilling_network
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    expose:
      - "8001"
    env_file: .env
    volumes:
      - ./services/identity:/app/services/identity
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/superadmin`) || PathPrefix(`/setup`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.services.identity.loadbalancer.server.port=8001"
      - "traefik.http.routers.identity.middlewares=cors-headers,rate-limit"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  learning:
    build:
      context: .
      dockerfile: services/learning/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    expose:
      - "8002"
    env_file: .env
    volumes:
      - ./services/learning:/app/services/learning
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learning.rule=PathPrefix(`/api/v1/learning`)"
      - "traefik.http.routers.learning.entrypoints=web"
      - "traefik.http.services.learning.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.learning-stripprefix.stripprefix.prefixes=/api/v1/learning"
      - "traefik.http.routers.learning.middlewares=cors-headers,rate-limit,learning-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  agents:
    build:
      context: ./services/agents
    restart: unless-stopped
    expose:
      - "8003"
    env_file: .env
    volumes:
      - ./services/agents:/app
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agents.rule=PathPrefix(`/api/v1/agents`)"
      - "traefik.http.routers.agents.entrypoints=web"
      - "traefik.http.services.agents.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.agents-stripprefix.stripprefix.prefixes=/api/v1/agents"
      - "traefik.http.routers.agents.middlewares=cors-headers,rate-limit,agents-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    expose:
      - "8004"
    env_file: .env
    volumes:
      - ./services/notifications:/app/services/notifications
      - ./packages/common:/app/packages/common
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/api/v1/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.services.notifications.loadbalancer.server.port=8004"
      - "traefik.http.middlewares.notifications-stripprefix.stripprefix.prefixes=/api/v1/notifications"
      - "traefik.http.routers.notifications.middlewares=cors-headers,rate-limit,notifications-stripprefix"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  piper_voices:
  comfyui_models:
  comfyui_input:
  comfyui_output:

networks:
  upskilling_network:
    driver: bridge
