services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -ec '</dev/tcp/127.0.0.1/5672'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  hindsight:
    build:
      context: ../hindsight/hindsight
      dockerfile: docker/standalone/Dockerfile
      target: api-only
      args:
        INCLUDE_API: "true"
        INCLUDE_CP: "false"
        INCLUDE_LOCAL_MODELS: "${HINDSIGHT_INCLUDE_LOCAL_MODELS:-false}"
        PRELOAD_ML_MODELS: "${HINDSIGHT_PRELOAD_ML_MODELS:-false}"
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-info}
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openrouter}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-120b:free}
      HINDSIGHT_API_OPENROUTER_API_KEY: ${HINDSIGHT_API_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-openrouter}
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-openrouter}
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: ${HINDSIGHT_API_SKIP_LLM_VERIFICATION:-false}
      HINDSIGHT_API_LAZY_RERANKER: ${HINDSIGHT_API_LAZY_RERANKER:-true}
    expose:
      - "8888"
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    networks:
      - upskilling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - upskilling_network
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_IDENTITY_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_LEARNING_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_AGENTS_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_NOTIFICATIONS_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_SETUP_KEY: ${SETUP_SECRET_KEY}
        SKIP_NEXT_BUILD_CHECKS: "1"
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://traefik
      INTERNAL_IDENTITY_URL: http://identity:8001
      LEARNING_URL: http://learning:8002
      LEARNING_SERVICE_BASE_URL: http://learning:8002
      HINDSIGHT_URL: ${HINDSIGHT_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
    expose:
      - "3000"
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      identity:
        condition: service_started
      learning:
        condition: service_started
      notifications:
        condition: service_started
      hindsight:
        condition: service_started

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    env_file: ${APP_ENV_FILE:-.env}
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/identity`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/sync`) || PathPrefix(`/api/v1/superadmin`) || PathPrefix(`/api/v1/tenants`) || PathPrefix(`/api/v1/onboarding`) || PathPrefix(`/setup`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.routers.identity.priority=100"
      - "traefik.http.services.identity.loadbalancer.server.port=8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  learning:
    build:
      context: .
      dockerfile: services/learning/Dockerfile
    restart: unless-stopped
    expose:
      - "8002"
    env_file: ${APP_ENV_FILE:-.env}
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learning.rule=PathPrefix(`/api/v1/learning`)"
      - "traefik.http.routers.learning.entrypoints=web"
      - "traefik.http.routers.learning.priority=100"
      - "traefik.http.middlewares.learning-stripprefix.stripprefix.prefixes=/api/v1/learning"
      - "traefik.http.routers.learning.middlewares=learning-stripprefix"
      - "traefik.http.services.learning.loadbalancer.server.port=8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  agents:
    build:
      context: ./services/agents
    restart: unless-stopped
    expose:
      - "8003"
    env_file: ${APP_ENV_FILE:-.env}
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agents.rule=PathPrefix(`/api/v1/agents`)"
      - "traefik.http.routers.agents.entrypoints=web"
      - "traefik.http.routers.agents.priority=100"
      - "traefik.http.middlewares.agents-stripprefix.stripprefix.prefixes=/api/v1/agents"
      - "traefik.http.routers.agents.middlewares=agents-stripprefix"
      - "traefik.http.services.agents.loadbalancer.server.port=8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    restart: unless-stopped
    expose:
      - "8004"
    env_file: ${APP_ENV_FILE:-.env}
    networks:
      - upskilling_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/api/v1/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.routers.notifications.priority=100"
      - "traefik.http.middlewares.notifications-stripprefix.stripprefix.prefixes=/api/v1/notifications"
      - "traefik.http.routers.notifications.middlewares=notifications-stripprefix"
      - "traefik.http.services.notifications.loadbalancer.server.port=8004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  hindsight_data:

networks:
  upskilling_network:
    driver: bridge
