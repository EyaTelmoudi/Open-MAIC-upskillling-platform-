[project]
name = "upskilling-platform"
version = "0.1.0"
description = "Enterprise AI-Driven Upskilling & Mentorship Platform"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["common"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
